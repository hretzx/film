<style>body {
    background-color: #0C0C0C;
    color: #E9E1D7;
    -webkit-font-smoothing: antialiased
    }
.material-symbols-outlined {
    font-variation-settings: "FILL" 0, "wght" 300, "GRAD" 0, "opsz" 24
    }
input:focus + label, input:not(:placeholder-shown) + label {
    transform: translatey(-20px) scale(0.85);
    color: #C9A84C
    }
input {
    outline: none !important;
    box-shadow: none !important
    }
.form-container {
    max-width: 440px
    }
.film-grain {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 9999;
    opacity: 0.03;
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuAMuVN9SkiWtsBAATb_OnAQZzDqXqWbnf0KBCVNpuDsQLa-HE4qERir7Hb-5TA7rqValQKdnlus0-Dnz5KwQwcAfWx-boV7gtjBlfT5pRHzEaj94Iix5PqWc2fGGf6XhDqIG_gz6Ge2ngo-Lv393v5_gRWgWuZG0kO1QKB740Du3nWzYr6T9Z-J2FJNguoILNQzlHnLiKJ_iJ0WX3KCIOvOZFJUIvHqGYMLKxG2FF4Sk5wrzrz9j16tgpixSNNVqsWwobE85Iu7v1E)

<body class="bg-background selection:bg-primary selection:text-background flex flex-col min-h-screen">
<!-- Aesthetic Background Film Grain -->
<div class="film-grain"></div>
<!-- Main Canvas -->
<main class="flex-grow flex flex-col items-center justify-center relative px-margin-mobile">
<!-- Cinematic Header Anchor (Logo) -->
<div class="absolute top-12 left-0 w-full flex justify-center pointer-events-none">
<span class="font-label-caps text-[11px] tracking-[0.6em] text-on-surface opacity-60">CINEBOOK</span>
</div>
<!-- Login Form Section -->
<section class="form-container w-full py-section-padding flex flex-col items-center text-center">
<!-- Typography Lockup -->
<div class="mb-12">
<h1 class="font-display-lg text-[56px] leading-tight text-on-surface tracking-tight mb-4">
          WELCOME BACK
        </h1>
<p class="font-body-md text-secondary opacity-70 tracking-wide">
          Enter your credentials to continue
        </p>
</div>
<!-- Input Fields -->
<form class="w-full space-y-12" method="POST" action="/users/login/">
{% csrf_token %}
<!-- Username Input -->
<div class="relative group">
<input class="block w-full bg-transparent border-0 border-b border-outline-variant py-3 px-0 font-body-lg text-on-surface transition-all duration-300 focus:border-primary peer" id="username" name="username" placeholder=" " type="text"/>
<label class="absolute left-0 top-3 font-label-caps text-secondary uppercase tracking-[0.1em] pointer-events-none transition-all duration-300 transform origin-left peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0" for="username">
            Username
          </label>
</div>
<!-- Password Input -->
<div class="relative group">
<input class="block w-full bg-transparent border-0 border-b border-outline-variant py-3 px-0 font-body-lg text-on-surface transition-all duration-300 focus:border-primary peer" id="password" name="password" placeholder=" " type="password"/>
<label class="absolute left-0 top-3 font-label-caps text-secondary uppercase tracking-[0.1em] pointer-events-none transition-all duration-300 transform origin-left peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0" for="password">
            Password
          </label>
</div>
<!-- CTA Action -->
<div class="pt-8 flex flex-col gap-8 items-center">
<button class="group flex items-center gap-4 bg-primary-container text-on-primary-fixed px-12 py-5 font-label-caps text-label-caps tracking-[0.2em] transition-all duration-500 hover:bg-primary active:scale-[0.98]" type="submit">
            SIGN IN 
            <span class="material-symbols-outlined text-[18px] transition-transform duration-300 group-hover:translate-x-1">arrow_right_alt</span>
</button>
<!-- Footer Link -->
<a class="font-caption text-caption text-secondary hover:text-primary transition-colors tracking-widest uppercase" href="/users/register/">
            New here? <span class="border-b border-outline-variant hover:border-primary pb-0.5 ml-1">Create an account</span>
</a>
</div>
</form>
</section>
</main>
<!-- Visual Ornament: Background Ambient Shader -->
<div class="fixed inset-0 -z-10 opacity-20 pointer-events-none overflow-hidden">

</div>
<!-- Minimal Footer Section (Suppressing Full Footer for Focus) -->
<footer class="w-full py-12 px-margin-mobile flex justify-center items-center">
<p class="font-caption text-[10px] text-secondary opacity-30 tracking-[0.3em] uppercase">
      © 2024 CINEBOOK. ALL RIGHTS RESERVED.
    </p>
</footer>
<script>
    // Micro-interaction: Input focus border logic handled via CSS peer classes
    // (Form submits normally to the backend — no preventDefault.)

    // Handle smooth transitions for the shader on load
    window.addEventListener('load', () => {
      document.body.style.opacity = '0';
      setTimeout(() => {
        document.body.style.transition = 'opacity 1.5s ease-in-out';
        document.body.style.opacity = '1';
      }, 50);
    });
  </script>
</body></html>
